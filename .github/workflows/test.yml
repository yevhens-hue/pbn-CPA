name: Tests & Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r PBN_Automation_Final/requirements.txt
          pip install pytest pytest-cov pytest-asyncio
          pip install -r PBN_Automation_Final/games-income/scraper/requirements.txt

      - name: Run tests
        run: |
          pytest tests/ -v --cov=PBN_Automation_Final/core --cov-report=xml

      - name: Upload coverage
        if: ${{ matrix.python-version == '3.11' }}
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          pip install flake8 black mypy

      - name: Check formatting with Black
        run: |
          black --check PBN_Automation_Final/core/

      - name: Run Flake8
        run: |
          flake8 PBN_Automation_Final/core/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run MyPy
        run: |
          mypy PBN_Automation_Final/core/ --ignore-missing-imports

  security:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check for secrets
        run: |
          pip install detect-secrets
          detect-secrets scan --baseline .secrets.baseline

      - name: Audit dependencies
        run: |
          pip install safety
          safety check --file=PBN_Automation_Final/requirements.txt || true
